version: '3.8'

services:
  web:
    build: .
    container_name: crossword-app
    ports:
      - "80:80"
    volumes:
      - staticfiles:/app/staticfiles
    restart: unless-stopped
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/staticfiles:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  staticfiles:
